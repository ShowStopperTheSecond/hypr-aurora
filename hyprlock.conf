# Aurora lock screen: centered, minimal.

$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles
source = colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = glide, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, glide
    animation = fadeOut, 1, 3, glide
    animation = inputFieldDots, 1, 2, glide
}

background {
    monitor =
    path = $ml4w_cache_folder/blurred_wallpaper.png
    blur_passes = 2
    blur_size = 5
    noise = 0.015
    brightness = 0.65
    vibrancy = 0.2
    crossfade_time = 0.6
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $on_surface
    font_size = 120
    font_family = Inter Light
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0,0,0,0.4)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $on_surface_variant
    font_size = 20
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    outer_color = $primary $tertiary 135deg
    inner_color = rgba(13,14,19,0.6)
    font_color = $on_surface
    font_family = Inter
    fade_on_empty = true
    fade_timeout = 1200
    placeholder_text = <span foreground="##8f9099">$USER</span>
    hide_input = false
    rounding = 14
    check_color = $primary $tertiary 135deg
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 6
    shadow_size = 14
    shadow_color = rgba(0,0,0,0.5)
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT[US,IR]
    color = $outline
    font_size = 13
    font_family = Inter
    position = 0, -105
    halign = center
    valign = center
}

# Battery (stays empty on desktops without one)
label {
    monitor =
    text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$c" ] && echo "${c}%"
    color = $outline
    font_size = 13
    font_family = Inter
    position = 0, 30
    halign = center
    valign = bottom
}
