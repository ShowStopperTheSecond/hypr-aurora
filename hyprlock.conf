#
# Aurora lock screen: editorial, left-aligned, minimal.

$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles
source = colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = glide, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, glide
    animation = fadeOut, 1, 3, glide
    animation = inputFieldDots, 1, 2, glide
}

background {
    monitor =
    path = $ml4w_cache_folder/blurred_wallpaper.png
    blur_passes = 2
    blur_size = 5
    noise = 0.015
    brightness = 0.65
    vibrancy = 0.2
    crossfade_time = 0.6
}

# Dark scrim on the left so the clock stays legible on any wallpaper
shape {
    monitor =
    size = 760, 2400
    color = rgba(13,14,19,0.45)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
}

# Hour
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H')"
    color = $on_surface
    font_size = 170
    font_family = Inter Thin
    position = 110, 40
    halign = left
    valign = center
}

# Minutes, in the accent colour
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"
    color = $primary
    font_size = 170
    font_family = Inter Thin
    position = 110, -160
    halign = left
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A  ·  %d %B %Y')"
    color = $on_surface_variant
    font_size = 16
    font_family = Inter
    position = 118, 210
    halign = left
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.4
    dots_center = false
    dots_rounding = -1
    outer_color = $primary $tertiary 135deg
    inner_color = rgba(13,14,19,0.6)
    font_color = $on_surface
    font_family = Inter
    fade_on_empty = true
    fade_timeout = 1200
    placeholder_text = <span foreground="##8f9099">$USER</span>
    hide_input = false
    rounding = 12
    check_color = $primary $tertiary 135deg
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $tertiary
    position = 110, 120
    halign = left
    valign = bottom
    shadow_passes = 6
    shadow_size = 14
    shadow_color = rgba(0,0,0,0.5)
}

# Keyboard layout (US / IR)
label {
    monitor =
    text = $LAYOUT[US,IR]
    color = $outline
    font_size = 13
    font_family = Inter
    position = 120, 80
    halign = left
    valign = bottom
}

# Battery (hidden automatically on desktops with no battery)
label {
    monitor =
    text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); [ -n "$c" ] && echo "${c}%"
    color = $outline
    font_size = 13
    font_family = Inter
    position = -50, 40
    halign = right
    valign = bottom
}
